[project]
name = "listen-and-show-and-translate"
version = "0.1.0"
description = "只监听指定程序音频、实时生成原文/译文/双语字幕的透明置顶悬浮窗（Windows）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "NaughtDZ" }]

# 说明：依赖由 uv 管理，运行时用 `uv pip sync requirements.txt`
# 这里只声明核心约束，便于后续打包与元数据工具读取
dependencies = [
    "PySide6>=6.8",
    "proc-tap>=1.1.1",
    # 发声进程枚举：Windows 音频会话 API（音量合成器同款）
    # 注意 proc-tap 自带的 --list-audio-procs 不可用，见 docs/P0-实测记录.md 第 2 节
    "pycaw>=20240210",
    "comtypes>=1.4",
    "psutil>=6.0",
    "sherpa-onnx>=1.13.8",
    "numpy>=1.26",
    "soxr>=0.5",
    "soundfile>=0.12",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
# 可选：NVIDIA 专用加速（不装也能跑）
nvidia = ["faster-whisper>=1.1"]
# 可选：中端 DirectML 推理（P2 实测后决定是否启用）
directml = ["onnxruntime-directml>=1.20"]

[project.scripts]
lst = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
